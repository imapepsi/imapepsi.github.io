<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Cream+Soda&family=Montserrat&display=swap" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
</head>
<body>

<navigation-component></navigation-component>


<div id="blog" class="page active">
    <div class="blog-header">
        <h1 class="page-title">Life of a PhD Mom</h1>
    </div>

    <div class="blog-layout">
        <div class="side-column">
            <div class="blog-navigation">
                <span style="color: var(--lm-primary); font-weight: 600;">Time Machine:</span>
                <div class="time-machine">
                    <div class="year-selector active" onclick="filterByYear(2026)">2026</div>
                    <div class="year-selector" onclick="filterByYear(2025)">2025</div>
                    <div class="year-selector" onclick="filterByYear('all')">All</div>
                </div>

                <br>

                <div id="blog-posts">
                    Loading blog posts...
                </div>
            </div>

            <div class="blog-list" id="recentPostsContainer">
                <div class="loading">Loading recent posts...</div>
            </div>
        </div>

        <div id="blogContainer">
            <div class="loading">Loading latest blog post...</div>
        </div>


    </div>
</div>

<!-- Link to external JavaScript file -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="components/hamburger-menu.js"></script>
<script src="components/navigation.js"></script>
<script src="components/blogpost-loader.js"></script>
<script src="components/blogpost-timemachine.js"></script>



</body>
</html>
